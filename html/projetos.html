<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instituto Esperança</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body><a class="pular-conteudo" href="#conteudo">
    Pular para o conteúdo
</a>
    


    <header class="flex-header">
        <div class="marca"><img src="../imagens/logo.webp" alt="" class="logo" width="48" height="48"><h1>Instituto Esperança</h1>
        </div><nav aria-label="Menu principal">
            <input type="checkbox" id="menu-toggle" aria-label="Abrir ou fechar menu">
            <label for="menu-toggle" class="menu-icon" aria-label="Abrir ou fechar menu">☰</label>

            <ul class="flex-menu">
                <li><a href="#inicio">Início</a></li>
                <li class="item-submenu">
                    <a href="#projetos">Projetos</a>
                    <ul class="submenu">
                        <li><a href="#projetos/alimentos">Campanha de alimentos</a></li>
                        <li><a href="#projetos/voluntariado">Voluntariado</a></li>
                        <li><a href="#projetos/comunidade">Ações comunitárias</a></li>
                        <li><a href="#projetos/contribuir">Como contribuir</a></li>
                    </ul>
                </li>
                <li><a href="#cadastro">Cadastre-se</a></li>
            </ul>
        </nav>
    <button type="button" class="botao botao-contraste" id="alternar-contraste" aria-pressed="false">Alto contraste</button>
    </header>

    <main class="grid-container" id="conteudo" tabindex="-1">

        <p class="col-12">Carregando conteúdo...</p></main>

    <template id="pagina-inicio"><section class="col-12">
            <h2>Sobre a ONG</h2>

            <p>
                O Instituto Esperança é uma organização que ajuda pessoas
                em situação de vulnerabilidade social.
            </p>

            
        </section>

        <section class="col-6 card">
            <h2>Nossa atuação</h2>

            <article>
                <h3>Ajuda à comunidade</h3>
                <p>
                    Realizamos ações para ajudar pessoas que precisam de
                    apoio e melhorar a qualidade de vida da comunidade.
                </p>
            </article>

            <article>
                <h3>Trabalho voluntário</h3>
                <p>
                    Também contamos com voluntários para participar das
                    nossas ações e projetos sociais.
                </p>
            </article>
        </section>

        <section class="col-6 card">
            <h2>Entre em contato</h2>
            <p>E-mail: contato@institutoesperanca.org</p>
            <p>Telefone: (51) 911111-1111</p>
            <p>Endereço: Rua da Esperança, 100 - Porto Alegre - RS</p>
        </section>


        <section class="col-12 card" id="feedback">
            <h2>Feedback</h2>

            <div class="badges" aria-label="Categorias">
                <span class="badge badge-ativo">Ativo</span>
                <span class="badge badge-novo">Novo</span>
                <span class="badge badge-voluntario">Voluntariado</span>
            </div>

            <div class="alert alert-sucesso" role="alert">
                <strong>Sucesso</strong>
                Cadastro disponível para novos voluntários.
            </div>

            <div class="alert alert-info" role="status">
                <strong>Informação</strong>
                Confira os projetos disponíveis no menu.
            </div>

            <div class="modal-area">
                <button type="button" class="botao" data-acao="abrir-modal">Abrir exemplo de modal</button>
                <button type="button" class="botao" data-acao="mostrar-toast">Mostrar exemplo de toast</button>
                <dialog class="modal" aria-labelledby="titulo-modal" id="modal" aria-modal="true">
                    <h3 id="titulo-modal">Exemplo de modal</h3>
                    <p>Obrigado por conhecer o Instituto Esperança.</p>
                    <button type="button" class="botao" data-acao="fechar-modal" autofocus="autofocus">Fechar</button>
                </dialog>
                </div>
        </section>

        <div class="toast" id="toast" role="status">
            ✓ Exemplo visual de toast: ação realizada com sucesso!
            <button type="button" class="botao" data-acao="fechar-toast">Fechar</button>
        </div>

    </template><template id="pagina-projetos"><div id="lista-projetos" class="col-12 grid-projetos"></div><section class="col-12 card">
            <h2>Status dos projetos</h2>
            <div class="badges">
                <span class="badge badge-ativo">Projeto ativo</span>
                <span class="badge badge-novo">Novidade</span>
                <span class="badge badge-voluntario">Voluntários</span>
            </div>

            <div class="alert alert-sucesso" role="alert">
                <strong>Sucesso</strong>
                Os projetos estão disponíveis para participação.
            </div>
        </section>

    </template><template id="pagina-cadastro"><form class="col-12 flex-form" id="cadastro">
            <p class="ajuda">Todos os campos são obrigatórios. Use dados fictícios: o preenchimento fica salvo neste navegador, sem envio a um servidor.</p>

            <fieldset>
                <legend>Dados pessoais</legend>

                <label for="nome">Nome completo:</label>
                <input aria-describedby="erro-nome" type="text" id="nome" name="nome" required>
                <span class="erro-campo" id="erro-nome">Preencha seu nome completo.</span>

                <label for="email">E-mail:</label>
                <input aria-describedby="erro-email" type="email" id="email" name="email" required>
                <span class="erro-campo" id="erro-email">Informe um e-mail válido, como nome@exemplo.com.</span>

                <label for="nascimento">Data de nascimento:</label>
                <input aria-describedby="erro-nascimento" type="date" id="nascimento" name="nascimento" required>
                <span class="erro-campo" id="erro-nascimento">Informe uma data válida.</span>

                <label for="cpf">CPF:</label>
                <input aria-describedby="erro-cpf" type="text" id="cpf" name="cpf" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" placeholder="000.000.000-00" required inputmode="numeric">
                <span class="erro-campo" id="erro-cpf">Use o formato 000.000.000-00.</span>
            </fieldset>

            <fieldset>
                <legend>Contato</legend>

                <label for="telefone">Telefone:</label>
                <input aria-describedby="erro-telefone" type="tel" id="telefone" name="telefone" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" placeholder="(51) 99999-9999" required inputmode="numeric">
                <span class="erro-campo" id="erro-telefone">Use o formato (51) 99999-9999.</span>

                <label for="cep">CEP:</label>
                <input aria-describedby="erro-cep" type="text" id="cep" name="cep" pattern="[0-9]{5}-[0-9]{3}" placeholder="00000-000" required inputmode="numeric">
                <span class="erro-campo" id="erro-cep">Use o formato 00000-000.</span>

                <label for="endereco">Endereço:</label>
                <input aria-describedby="erro-endereco" type="text" id="endereco" name="endereco" required>
                <span class="erro-campo" id="erro-endereco">Preencha o endereço.</span>

                <label for="cidade">Cidade:</label>
                <input aria-describedby="erro-cidade" type="text" id="cidade" name="cidade" required>
                <span class="erro-campo" id="erro-cidade">Preencha a cidade.</span>
            </fieldset>

            <button type="submit">Enviar cadastro</button>

        <div id="feedback-cadastro" role="status" hidden="hidden"></div></form>

    </template><footer class="flex-footer">
        <p>© 2026 Instituto Esperança</p>
    </footer>

    <template id="modelo-card"><section class="col-6 card"><h2 class="titulo-card"></h2><article><h3 class="subtitulo-card"></h3><p class="descricao-card"></p></article></section></template>


<script type="module" src="../js/main.js"></script>
</body></html>
